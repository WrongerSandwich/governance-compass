services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: governance_compass
      POSTGRES_PASSWORD: governance_compass
      POSTGRES_DB: governance_compass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance_compass"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
