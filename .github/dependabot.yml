version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Let a release sit before we open a PR on it. Dev-dependency patch/minor
    # bumps now auto-merge once CI is green, so this soak time is the main
    # guard against a freshly-compromised release landing unreviewed.
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 5
      semver-major-days: 7
    ignore:
      # Major bumps that require migration work — handle separately when ready.
      - dependency-name: "prisma"          # #15
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"  # #15
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"          # #16
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"      # #17
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"     # #18
        update-types: ["version-update:semver-major"]
    groups:
      # Keep react and react-dom (and their types) on one PR — React requires the
      # runtime and renderer to match exactly, and a split bump drifts them apart.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Same for the Next.js packages, whose versions are published in lockstep.
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      # Bundle the remaining devDependencies into a single weekly PR to cut
      # review churn. Listed last: a dependency joins the first group it matches.
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    # These auto-merge at every semver level, so they get a soak period too.
    # The github-actions ecosystem supports only the flat `default-days`.
    cooldown:
      default-days: 5
